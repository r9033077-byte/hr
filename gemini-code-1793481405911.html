<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FresherEx | Interactive Voice Portal</title>
<style>
:root{--ink:#101010;--muted:#666;--line:#e7e7e7;--paper:#fff;--soft:#f5f5f5;--radius:16px;--shadow:0 8px 28px rgba(0,0,0,.06)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fafafa;color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.wrap{max-width:1320px;margin:auto;padding:0 22px}
.company-strip{background:#101010;color:#fff;font-size:12px}
.company-strip .wrap{display:flex;gap:10px 22px;align-items:center;flex-wrap:wrap;padding-top:11px;padding-bottom:11px}
.company-strip span{white-space:nowrap}
.company-strip b{font-weight:700;color:#fff}
.topnav{background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:20}
.nav-inner{height:82px;display:flex;align-items:center;justify-content:center;gap:20px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:#111}
.brand-mark{width:48px;height:48px;background:#111;color:#fff;border-radius:14px;display:grid;place-items:center;font-size:29px;font-weight:900}
.brand-name{font-size:28px;letter-spacing:-1.5px;font-weight:850}

/* Onboarding Form Box */
.onboarding-box {
    background: #ffffff;
    border: 2px solid #111;
    border-radius: 24px;
    padding: 30px 25px;
    margin: 40px auto;
    max-width: 500px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.12);
    text-align: center;
}
.onboarding-box h3 { margin-top: 0; font-size: 22px; margin-bottom: 15px; }
.onboarding-box input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-size: 16px;
    margin-bottom: 20px;
    outline: none;
    transition: border-color 0.2s;
}
.onboarding-box input[type="text"]:focus { border-color: #007bff; }
.onboarding-box button {
    width: 100%;
    padding: 14px;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    transition: background 0.2s;
}
.onboarding-box button:hover { background: #333; }

/* Voice & Robot Container */
.voice-widget {
    background: #ffffff;
    border: 2px solid #111;
    border-radius: 24px;
    padding: 30px 20px;
    margin: 40px auto;
    max-width: 650px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.12);
    text-align: center;
    display: none;
}
.voice-status { font-size: 16px; color: #111; margin-bottom: 25px; font-weight: 600; min-height: 30px; display: flex; align-items: center; justify-content: center; }

/* Animated Round Robot Avatar & Voice Visualizer */
.robot-avatar-container {
    position: relative;
    width: 170px;
    height: 170px;
    margin: 0 auto 30px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Outer Pulsing Soundwaves */
.sound-ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 3px solid rgba(0, 123, 255, 0.2);
    box-sizing: border-box;
}

.speaking .sound-ring-1 {
    animation: pulseRing 1.5s infinite ease-in-out;
}
.speaking .sound-ring-2 {
    animation: pulseRing 1.5s infinite ease-in-out 0.4s;
}

@keyframes pulseRing {
    0% { transform: scale(0.95); opacity: 0.8; border-color: #007bff; }
    50% { transform: scale(1.25); opacity: 0.4; border-color: #00d2ff; }
    100% { transform: scale(1.4); opacity: 0; }
}

/* Robot Head Circle */
.robot-head {
    width: 130px;
    height: 130px;
    background: linear-gradient(145deg, #1e1e24, #111115);
    border-radius: 50%;
    border: 4px solid #333;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
}

/* Robot Glowing Eyes */
.robot-eyes {
    display: flex;
    gap: 22px;
    margin-bottom: 15px;
}
.eye {
    width: 14px;
    height: 14px;
    background: #00d2ff;
    border-radius: 50%;
    box-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff;
    transition: all 0.2s;
}

/* Robot Animated Mouth */
.robot-mouth {
    width: 36px;
    height: 6px;
    background: #00d2ff;
    border-radius: 10px;
    box-shadow: 0 0 8px #00d2ff;
    transition: all 0.1s ease-in-out;
}

/* Active Voice Animations */
.speaking .robot-head {
    border-color: #007bff;
    box-shadow: 0 0 25px rgba(0, 123, 255, 0.4);
}
.speaking .eye {
    animation: blink 3s infinite;
}
.speaking .robot-mouth {
    animation: talkMouth 0.25s infinite alternate ease-in-out;
}

@keyframes talkMouth {
    0% { height: 4px; width: 30px; border-radius: 4px; }
    100% { height: 18px; width: 36px; border-radius: 12px; }
}

@keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
}

.voice-controls { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
.v-btn { padding: 13px 26px; border-radius: 12px; font-weight: 700; font-size: 16px; transition: 0.2s; }
.btn-yes { background: #28a745; color: #fff; border: none; }
.btn-no { background: #dc3545; color: #fff; border: none; }
.btn-repeat { background: #007bff; color: #fff; border: none; }
.btn-start { background: #111; color: #fff; border: none; }
.v-btn:disabled { background: #ccc; cursor: not-allowed; opacity: 0.7; }
</style>
</head>
<body>

<div class="company-strip">
  <div class="wrap">
    <span>▣ <b>Udyam Reg No:</b> UDYAM-DL-02-0020872</span><span>│</span>
    <span>▦ <b>Reg. Date:</b> 27 Nov 2021</span><span>│</span>
    <span>▣ <b>Type:</b> Proprietary Firm</span><span>│</span>
    <span>⚙ <b>Activity:</b> Services</span><span>│</span>
    <span>⌖ <b>Office:</b> Delhi & Noida</span>
  </div>
</div>

<header class="topnav">
  <div class="wrap nav-inner">
    <a class="brand" href="#home">
      <div class="brand-mark">F</div>
      <div class="brand-name">FresherEx</div>
    </a>
  </div>
</header>

<main class="wrap" id="home">

  <!-- Step 1: User Name Input Box -->
  <div class="onboarding-box" id="onboardingSection">
    <h3>अपना नाम दर्ज करें</h3>
    <input type="text" id="userNameInput" placeholder="अपना पूरा नाम यहाँ लिखें..." autocomplete="off">
    <button onclick="submitUserName()">सबमिट करें (Submit)</button>
  </div>

  <!-- Step 2: Voice Assistant Section -->
  <div class="voice-widget" id="voiceWidget">
    <div id="voiceStatus" class="voice-status">ऑडियो लोड हो रहा है...</div>
    
    <!-- Animated Robot Avatar -->
    <div class="robot-avatar-container" id="avatarContainer">
      <div class="sound-ring sound-ring-1"></div>
      <div class="sound-ring sound-ring-2"></div>
      <div class="robot-head">
        <div class="robot-eyes">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
        <div class="robot-mouth" id="robotMouth"></div>
      </div>
    </div>

    <!-- Interactive Buttons -->
    <div class="voice-controls">
      <!-- Confirmation Buttons for Initial Question -->
      <button id="confirmYesBtn" class="v-btn btn-yes" onclick="handleConfirmation(true)" style="display:none;">हाँ (Yes)</button>
      <button id="confirmNoBtn" class="v-btn btn-no" onclick="handleConfirmation(false)" style="display:none;">नहीं (No)</button>
      
      <!-- Final Action Buttons -->
      <button id="finalYesBtn" class="v-btn btn-yes" onclick="handleFinalYes()" style="display:none;" disabled>हाँ (एचआर से जुड़ें)</button>
      <button id="repeatBtn" class="v-btn btn-repeat" onclick="handleRepeat()" style="display:none;" disabled>दोबारा सुनें</button>
    </div>
  </div>

</main>

<script>
let userName = "";
let currentLineIndex = 0;
let selectedVoice = null;
let speechScript = [];

const baseSpeechScript = [
  "नमस्ते! FresherEx में आपका स्वागत है। चलिए, सबसे पहले आपको हमारी कंपनी के बारे में दस जरूरी बातें बताते हैं।",
  "पहला, हमारी कंपनी FresherEx एक रजिस्टर्ड फर्म है, जो एमएसएमई और उद्यम के तहत रजिस्टर्ड है।",
  "दूसरा, इसकी शुरुआत 26 नवंबर 2021 को पूर्वी दिल्ली में हुई थी।",
  "तीसरा, हमारा मुख्य मकसद फ्रेशर्स और युवाओं को सही जॉब दिलाने में मदद करना है।",
  "चौथा, हम पूरी ईमानदारी और भरोसे के साथ अपनी सर्विस देते हैं।",
  "पाँचवा, हमारी कंपनी सरकार के सभी नियमों का पूरा पालन करती है।",
  "छठा, हमने अब तक हजारों लोगों को अच्छी जॉब दिलाने में मदद की है।",
  "सातवाँ, हमारा काम करने का तरीका एकदम सेफ और आसान है।",
  "आठवाँ, हम कभी भी किसी से भी कोई फालतू पैसा नहीं लेते।",
  "नवा, हमारी टीम हर कैंडिडेट की काबिलियत के हिसाब से उसकी पूरी मदद करती है।",
  "दसवाँ, हम हमेशा नई टेक्नोलॉजी का इस्तेमाल करके अपनी सर्विस को और बेहतर बनाते हैं।",
  "अब आपको कंपनी के बारे में संक्षेप में बता देते हैं। FresherEx दिल्ली की एक जानी-मानी कंपनी है, जिसका उद्यम रजिस्ट्रेशन नंबर है UDYAM-DL-02-0020872। यह कंपनी 26 नवंबर 2021 से लोगों को बेहतरीन जॉब और वर्कफोर्स सर्विस देने का काम कर रही है।",
  
  "चलिए अब बात करते हैं वर्तमान जॉब ओपनिंग्स, सैलरी और इंसेंटिव के बारे में। इसे ध्यान से समझें।",
  "अगर आप घर से काम करते हैं, यानी वर्क फ्रॉम होम लेते हैं, तो एचआर रिक्रूटर और टीम लीडर पद के लिए आपकी फिक्स सैलरी 18,000 रुपये प्रति महीना रहेगी। और डेटा एंट्री ऑपरेटर पद के लिए फिक्स सैलरी 17,000 रुपये महीना रहेगी।",
  "वहीं अगर आप ऑफिस से काम करते हैं, यानी वर्क फ्रॉम ऑफिस चुनते हैं, तो कस्टमर सपोर्ट एग्जीक्यूटिव की शुरुआत 15,000 रुपये से है, सेल्स एग्जीक्यूटिव की शुरुआत 18,000 रुपये से है, तथा रिकवरी एग्जीक्यूटिव और स्टार हेल्थ इंश्योरेंस एग्जीक्यूटिव की सैलरी 25,000 रुपये तक रहती है।",
  "एक बार फिर ध्यान से सुनें: वर्क फ्रॉम होम में 17,000 से 18,000 रुपये सैलरी है और वर्क फ्रॉम ऑफिस में 15,000 से 25,000 रुपये तक सैलरी दी जाती है।",
  "इसके अलावा, सबसे बड़ी बात यह है कि आपकी फिक्स सैलरी के बाद यदि आप एक्स्ट्रा काम करते हैं और आपकी परफॉर्मेंस अच्छी रहती है, तो कंपनी की तरफ से आपको बहुत ही बेहतरीन और अच्छी-खासी इंसेंटिव राशि भी दी जाती है। यानी आपकी जितनी अच्छी परफॉर्मेंस होगी, आपकी कमाई उतनी ही ज्यादा बढ़ती जाएगी।",
  
  "ट्रेनिंग की बात करें तो, वर्क फ्रॉम होम वाली जॉब के लिए कंपनी दो दिन की फ्री ट्रेनिंग देती है ताकि आपको काम समझने में आसानी हो। ध्यान रहे, इस दो दिन की ट्रेनिंग का कोई पैसा नहीं मिलता, यह अनपेड होती है।",
  "जॉइनिंग के समय आपके पास पैन कार्ड और आधार कार्ड ओरिजिनल या साफ फोटोकॉपी के साथ होना चाहिए।",
  "हमारे ऑफिस के दो पते हैं। पहला ऑफिस नोएडा सेक्टर 16 मेट्रो स्टेशन के पास है, और दूसरा ऑफिस दिल्ली में सरिता विहार बॉर्डर के पास है।",
  "अप्लाई करने के लिए आप अपना रिज्यूमे सीधे हमारे व्हाट्सएप नंबर 8920226993 पर भेज सकते हैं। सबसे खास बात यह है कि हमारे यहाँ जॉब के लिए कोई फीस नहीं ली जाती, सब कुछ एकदम फ्री है। किसी भी धोखाधड़ी से बचने के लिए सिर्फ हमारे इसी आधिकारिक नंबर पर संपर्क करें।",
  "तो क्या आप इस जॉब इंटरव्यू के लिए इंटरेस्टेड हैं? अगर आप इंटरेस्टेड हैं, तो मैं आपको सीधे हमारे एचआर हेड से कनेक्ट करवा सकती हूँ। इसके लिए बस नीचे दिए गए 'हाँ' वाले बटन पर क्लिक करें!"
];

// Realistic Female Voice Selector
function getRealisticFemaleVoice() {
  const voices = window.speechSynthesis.getVoices();
  let femaleVoice = voices.find(v => (v.lang.includes('hi') || v.lang.includes('HI')) && 
    (v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('google') || v.name.toLowerCase().includes('natural') || v.name.toLowerCase().includes('swara') || v.name.toLowerCase().includes('kalpana') || v.name.toLowerCase().includes('zira')));
  
  if (!femaleVoice) {
    femaleVoice = voices.find(v => v.lang.includes('hi') || v.lang.includes('HI'));
  }
  if (!femaleVoice) {
    femaleVoice = voices.find(v => (v.lang.includes('en-IN') || v.lang.includes('en_IN')) && v.name.toLowerCase().includes('female'));
  }
  return femaleVoice || voices[0];
}

window.speechSynthesis.onvoiceschanged = () => {
  selectedVoice = getRealisticFemaleVoice();
};

function submitUserName() {
  const inputVal = document.getElementById('userNameInput').value.trim();
  if (!inputVal) {
    alert("कृपया अपना नाम दर्ज करें।");
    return;
  }
  userName = inputVal;

  document.getElementById('onboardingSection').style.display = 'none';
  document.getElementById('voiceWidget').style.display = 'block';

  speakInitialGreeting();
}

function speakInitialGreeting() {
  window.speechSynthesis.cancel();
  const text = "हेलो, जैसा कि मैं देख पा रही हूं कि आपने हमारे पोर्टल जॉब है एप्लीकेशन पे डाटा एंट्री ऑपरेटर के लिए अप्लाई किया हुआ है। क्या मैंने सही देखा?";
  
  document.getElementById('voiceStatus').innerText = "ऑडियो प्ले हो रहा है...";
  
  const utterance = new SpeechSynthesisUtterance(text);
  if (!selectedVoice) selectedVoice = getRealisticFemaleVoice();
  if (selectedVoice) utterance.voice = selectedVoice;
  
  utterance.lang = 'hi-IN';
  utterance.rate = 0.92;
  utterance.pitch = 1.05;

  const container = document.getElementById('avatarContainer');

  utterance.onstart = () => {
    container.classList.add('speaking');
  };

  utterance.onend = () => {
    container.classList.remove('speaking');
    document.getElementById('voiceStatus').innerText = "कृपया नीचे विकल्प चुनें:";
    document.getElementById('confirmYesBtn').style.display = 'inline-block';
    document.getElementById('confirmNoBtn').style.display = 'inline-block';
  };

  utterance.onerror = () => {
    container.classList.remove('speaking');
    document.getElementById('confirmYesBtn').style.display = 'inline-block';
    document.getElementById('confirmNoBtn').style.display = 'inline-block';
  };

  window.speechSynthesis.speak(utterance);
}

function handleConfirmation(isYes) {
  document.getElementById('confirmYesBtn').style.display = 'none';
  document.getElementById('confirmNoBtn').style.display = 'none';

  const transitionText = `ओके, तो ${userName} कैसे हैं? अच्छे होंगे। ठीक है, तो मैं अब आपको जॉब के बारे में स्टेप बाय स्टेप पूरी इनफार्मेशन समझा रही हूं और साथ ही आप सारी बातों को ध्यान से सुनिए क्योंकि लास्ट में आपके साथ एक ह्यूमन एचआर कनेक्ट होगा जो कि वो आपका लाइव इंटरव्यू लेगा। तो जो मैं आपको बताने जा रही हूं उन चीजों को एकदम नोट कर लीजिए और ध्यान से सुनिए।`;
  
  speechScript = [transitionText].concat(baseSpeechScript);

  document.getElementById('finalYesBtn').style.display = 'inline-block';
  document.getElementById('repeatBtn').style.display = 'inline-block';
  document.getElementById('finalYesBtn').disabled = false;
  document.getElementById('repeatBtn').disabled = false;

  currentLineIndex = 0;
  speakNextLine();
}

function speakNextLine() {
  const container = document.getElementById('avatarContainer');

  if (currentLineIndex >= speechScript.length) {
    document.getElementById('voiceStatus').innerText = "जानकारी पूरी हो गई है। आगे बढ़ने के लिए 'हाँ' बटन दबाएं।";
    container.classList.remove('speaking');
    return;
  }

  const text = speechScript[currentLineIndex];
  document.getElementById('voiceStatus').innerText = `ऑडियो प्ले हो रहा है... (${currentLineIndex + 1}/${speechScript.length})`;

  const utterance = new SpeechSynthesisUtterance(text);
  if (!selectedVoice) selectedVoice = getRealisticFemaleVoice();
  if (selectedVoice) utterance.voice = selectedVoice;
  
  utterance.lang = 'hi-IN';
  utterance.rate = 0.92;
  utterance.pitch = 1.05;

  utterance.onstart = () => {
    container.classList.add('speaking');
  };

  utterance.onend = () => {
    currentLineIndex++;
    speakNextLine();
  };

  utterance.onerror = (e) => {
    console.error("Speech Error", e);
    currentLineIndex++;
    speakNextLine();
  };

  window.speechSynthesis.speak(utterance);
}

function handleRepeat() {
  window.speechSynthesis.cancel();
  currentLineIndex = 0;
  speakNextLine();
}

function handleFinalYes() {
  window.speechSynthesis.cancel();
  document.getElementById('avatarContainer').classList.remove('speaking');
  document.getElementById('voiceStatus').innerText = "आपको सीधे एचआर हेड से जोड़ा जा रहा है...";
  
  const connectUtterance = new SpeechSynthesisUtterance("धन्यवाद! आपको सीधे हमारे एचआर हेड से कनेक्ट किया जा रहा है।");
  if (!selectedVoice) selectedVoice = getRealisticFemaleVoice();
  if (selectedVoice) connectUtterance.voice = selectedVoice;
  connectUtterance.lang = 'hi-IN';
  connectUtterance.pitch = 1.05;

  connectUtterance.onstart = () => {
    document.getElementById('avatarContainer').classList.add('speaking');
  };
  connectUtterance.onend = () => {
    document.getElementById('avatarContainer').classList.remove('speaking');
  };

  window.speechSynthesis.speak(connectUtterance);

  setTimeout(() => {
    const waMessage = encodeURIComponent(`Hello HR, my name is ${userName}. Please connect my interview.`);
    window.location.href = `https://wa.me/918920226993?text=${waMessage}`;
  }, 2500);
}
</script>
